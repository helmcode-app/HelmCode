<!DOCTYPE html>
<html lang="en" data-helm-scheme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-text-size-adjust: 100%;
      box-sizing: border-box;
    }
    *, *::before, *::after { box-sizing: inherit; }
    #editor {
      width: 100%;
      max-width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .cm-editor {
      height: 100%;
      width: 100%;
      max-width: 100%;
    }
    .cm-scroller {
      overflow-x: hidden !important;
    }

    /* Active line: slight rounding on caret row (content + gutter). */
    .cm-activeLine,
    .cm-activeLineGutter {
      border-radius: 3px;
    }

    /* Dark active line wash: CSS only (see editor-entry.mjs header). */
    html[data-helm-scheme="dark"] .cm-activeLine,
    html[data-helm-scheme="dark"] .cm-activeLineGutter {
      background-color: rgba(255, 255, 255, 0.12) !important;
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="editor.bundle.js"></script>
</body>
</html>
