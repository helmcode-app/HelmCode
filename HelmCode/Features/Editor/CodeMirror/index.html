<!DOCTYPE html>
<html lang="en" data-helm-scheme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      max-width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      -webkit-text-size-adjust: 100%;
      box-sizing: border-box;
    }
    *, *::before, *::after { box-sizing: inherit; }
    #editor {
      width: 100%;
      max-width: 100%;
      height: 100%;
      overflow: hidden;
    }
    .cm-editor {
      height: 100%;
      width: 100%;
      max-width: 100%;
    }
    .cm-scroller {
      overflow-x: hidden !important;
    }

    /* Active line: slight rounding on caret row (content + gutter). */
    .cm-activeLine,
    .cm-activeLineGutter {
      border-radius: 3px;
    }

    /* Dark active line wash: CSS only (see editor-entry.mjs header). */
    html[data-helm-scheme="dark"] .cm-activeLine,
    html[data-helm-scheme="dark"] .cm-activeLineGutter {
      background-color: rgba(255, 255, 255, 0.12) !important;
    }

    /* Line bookmarks: filled bookmark icon in the gutter (not a CM color theme). */
    .cm-bookmark-gutter {
      width: 14px;
      min-width: 14px;
    }
    .cm-bookmark-mark {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 100%;
      min-height: 1.2em;
      margin: 0 auto;
      color: #0a84ff; /* light: system blue */
      pointer-events: none;
    }
    .cm-bookmark-icon {
      display: block;
      width: 11px;
      height: 11px;
      flex-shrink: 0;
    }
    html[data-helm-scheme="dark"] .cm-bookmark-mark {
      color: #64d2ff; /* dark: lighter system blue */
    }
  </style>
</head>
<body>
  <div id="editor"></div>
  <script src="editor.bundle.js"></script>
</body>
</html>
